<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | Giga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Giga</div>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="order.html">Đơn hàng</a></li>
            </ul>
        </nav>
    </header>
    <main class="page-content">
        <section class="page-panel">
            <h2>Thanh toán nhanh</h2>
            <form id="payment-form" class="checkout-form">
                <div class="form-group">
                    <label for="card-name">Tên trên thẻ</label>
                    <input id="card-name" type="text" required>
                </div>
                <div class="form-group">
                    <label for="card-number">Số thẻ</label>
                    <input id="card-number" type="text" required>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label for="expiry">Hạn dùng</label>
                        <input id="expiry" type="text" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group half">
                        <label for="cvv">CVV</label>
                        <input id="cvv" type="text" required>
                    </div>
                </div>
                <button class="submit-btn" type="submit">Thanh toán</button>
            </form>
            <p class="note">Thanh toán mô phỏng để giúp quy trình nhanh chóng và đơn giản.</p>
        </section>
    </main>
    <footer>
        <p>&copy; Giga</p>
    </footer>
</body>
</html>

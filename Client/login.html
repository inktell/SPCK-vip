<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Giga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-lock"></i>
                    <h1>Đăng nhập</h1>
                </div>
                <p class="auth-subtitle">Chào mừng bạn trở lại Giga Mart</p>
            </div>

            <!-- Info Alert -->
            <div class="auth-alert alert-info">
                <i class="fas fa-info-circle"></i>
                <div>
                    <strong>Tài khoản admin:</strong> Sử dụng email <strong>admin@giga.com</strong>
                    <br><strong>Người bán:</strong> Sẽ tự động vào trang quản lý bán hàng
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="name@example.com"
                        required>
                    <div class="form-error" id="email-error"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-key"></i> Mật khẩu
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Nhập mật khẩu"
                            required>
                        <button type="button" class="password-toggle" id="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="password-error"></div>
                </div>

                <!-- Remember Me -->
                <div class="form-group checkbox">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Ghi nhớ tôi trên máy này</label>
                </div>

                <!-- Status Message -->
                <div id="auth-status" class="auth-status" aria-live="polite"></div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>Bạn chưa có tài khoản?</span>
            </div>

            <!-- Signup Link -->
            <a href="signup.html" class="btn btn-secondary btn-large">
                <i class="fas fa-user-plus"></i> Tạo tài khoản mới
            </a>

            <!-- Back Link -->
            <a href="index.html" class="auth-back-link">
                <i class="fas fa-arrow-left"></i> Trở về trang chủ
            </a>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>&copy; 2026 Giga Mart. Bảo mật tuyệt đối cho tài khoản của bạn.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
</body>
</html>

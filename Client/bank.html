<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng | Giga</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pzQf6Nrt0H5W+TD5QnYeQZEs5OblB+JFf0nYgA1z5cNhzShY4Vg0G2e7xdSlGf8TIVkT2lPqchmF0dYDM9XbBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Ngân Hàng</p>
            <h1>Quản lý thông tin ngân hàng</h1>
            <p>Nhập thông tin tài khoản ngân hàng để nhận thanh toán và cập nhật trạng thái giao dịch.</p>
        </header>

        <div class="layout">
            <main class="content">
                <section class="panel">
                    <div class="panel-title">
                        <h2>Thông tin ngân hàng</h2>
                        <p>Điền tên ngân hàng, số tài khoản và chi nhánh để liên kết với hệ thống.</p>
                    </div>
                    <div class="profile-summary">
                        <div class="field-group">
                            <div class="field">
                                <label>Ngân hàng</label>
                                <input type="text" value="Tech Bank" disabled>
                            </div>
                            <div class="field">
                                <label>Số tài khoản</label>
                                <input type="text" value="0123 4567 8901" disabled>
                            </div>
                            <div class="field">
                                <label>Chủ tài khoản</label>
                                <input type="text" value="Nguyễn Văn A" disabled>
                            </div>
                            <div class="field">
                                <label>Chi nhánh</label>
                                <input type="text" value="Hà Nội" disabled>
                            </div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Về trang chính</a>
                        <a href="profile.html" class="btn btn-primary"><i class="fas fa-user"></i> Quay lại Hồ Sơ</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
<script defer src="chatbot.js"></script>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Địa Chỉ | Giga</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pzQf6Nrt0H5W+TD5QnYeQZEs5OblB+JFf0nYgA1z5cNhzShY4Vg0G2e7xdSlGf8TIVkT2lPqchmF0dYDM9XbBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Địa Chỉ</p>
            <h1>Quản lý địa chỉ giao hàng</h1>
            <p>Thêm, sửa hoặc xóa địa chỉ nhận hàng để đơn hàng luôn đến đúng nơi.</p>
        </header>

        <div class="layout">
            <main class="content">
                <section class="panel">
                    <div class="panel-title">
                        <h2>Danh sách địa chỉ</h2>
                        <p>Quản lý các địa chỉ thường dùng cho việc giao nhận hàng.</p>
                    </div>
                    <div class="profile-summary">
                        <div class="field-group">
                            <div class="field">
                                <label>Địa chỉ chính</label>
                                <input type="text" value="123 Nguyễn Trãi, Thanh Xuân, Hà Nội" disabled>
                            </div>
                            <div class="field">
                                <label>Địa chỉ phụ</label>
                                <input type="text" value="Số 45, Đường 3/2, Quận 10, TP.HCM" disabled>
                            </div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Về trang chính</a>
                        <a href="profile.html" class="btn btn-primary"><i class="fas fa-user"></i> Quay lại Hồ Sơ</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
<script defer src="chatbot.js"></script>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giga - Mua sắm nhanh chóng</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Giga</div>
            <ul>
                <li><a href="menu.html">Trang chủ</a></li>
                <li><a href="#products">Sản phẩm</a></li>
                <li><a href="order.html">Giỏ hàng</a></li>
                <li><a href="login.html">Tài khoản</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>Chào mừng đến với Giga</h1>
            <p>Mua sắm nhanh chóng với tốc độ vượt trội</p>
            <button id="shop-now">Mua ngay</button>
        </section>

        <section id="products" class="products">
            <h2>Sản phẩm nổi bật</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <section id="cart" class="cart hidden">
            <h2>Giỏ hàng</h2>
            <div id="cart-items"></div>
            <button id="checkout-btn">Thanh toán</button>
        </section>

        <section id="checkout" class="checkout hidden">
            <h2>Thanh toán</h2>
            <form id="checkout-form">
                <!-- Checkout form -->
            </form>
        </section>

        <section id="account" class="account hidden">
            <h2>Tài khoản</h2>
            <div id="auth-section">
                <button id="login-btn">Đăng nhập</button>
                <button id="register-btn">Đăng ký</button>
            </div>
            <div id="user-info" class="hidden">
                <!-- User info -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Giga. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>

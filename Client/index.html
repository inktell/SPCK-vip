<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giga - Mua sắm nhanh chóng</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://placehold.co" crossorigin>
    <link rel="dns-prefetch" href="https://placehold.co">
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Giga</div>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="#products">Sản phẩm</a></li>
                <li><a href="order.html">Giỏ hàng</a></li>
                <li><a href="/AI/public/index.html">Trợ giúp AI</a></li>
                <li><a id="account-link" href="login.html">Tài khoản</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>Chào mừng đến với Giga</h1>
            <p>Mua sắm nhanh chóng với tốc độ vượt trội</p>
            <button id="shop-now">Mua ngay</button>
        </section>

        <section id="products" class="products">
            <h2>Sản phẩm nổi bật</h2>
            <div class="product-filters">
                <input id="product-search" class="product-search" type="search" placeholder="Tìm kiếm sản phẩm..." />
                <div id="category-filter" class="category-filter"></div>
            </div>
            <div class="product-grid" id="product-grid"></div>
        </section>

        <section id="cart" class="cart hidden">
            <h2>Giỏ hàng</h2>
            <div id="cart-items"></div>
            <div id="cart-total" class="total"></div>
            <button id="checkout-btn">Thanh toán</button>
        </section>

        <section id="checkout" class="checkout hidden">
            <h2>Thanh toán</h2>
            <form id="checkout-form"></form>
        </section>

    </main>

    <footer>
        <p>&copy; 2023 Giga. Tất cả quyền được bảo lưu.</p>
    </footer>

    <script defer src="main.js"></script>
    <script defer src="chatbot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu | Giga</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pzQf6Nrt0H5W+TD5QnYeQZEs5OblB+JFf0nYgA1z5cNhzShY4Vg0G2e7xdSlGf8TIVkT2lPqchmF0dYDM9XbBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Đổi Mật Khẩu</p>
            <h1>Bảo mật tài khoản của bạn</h1>
            <p>Thay đổi mật khẩu định kỳ giúp bảo vệ tài khoản khỏi truy cập trái phép.</p>
        </header>

        <div class="layout">
            <main class="content">
                <section class="panel">
                    <div class="panel-title">
                        <h2>Đổi mật khẩu</h2>
                        <p>Nhập mật khẩu hiện tại và mật khẩu mới để cập nhật.</p>
                    </div>
                    <div class="profile-summary">
                        <div class="field-group">
                            <div class="field">
                                <label>Mật khẩu hiện tại</label>
                                <input type="password" placeholder="Nhập mật khẩu hiện tại" disabled>
                            </div>
                            <div class="field">
                                <label>Mật khẩu mới</label>
                                <input type="password" placeholder="Nhập mật khẩu mới" disabled>
                            </div>
                            <div class="field">
                                <label>Xác nhận mật khẩu mới</label>
                                <input type="password" placeholder="Xác nhận mật khẩu mới" disabled>
                            </div>
                        </div>
                        <p style="color: var(--text-secondary); margin-top: 1rem;">Tính năng đổi mật khẩu sẽ được kích hoạt khi liên kết với hệ thống đăng nhập.</p>
                    </div>
                    <div class="profile-actions">
                        <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Về trang chính</a>
                        <a href="profile.html" class="btn btn-primary"><i class="fas fa-user"></i> Quay lại Hồ Sơ</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
<script defer src="chatbot.js"></script>
</html>

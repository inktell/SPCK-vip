<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo | Giga</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pzQf6Nrt0H5W+TD5QnYeQZEs5OblB+JFf0nYgA1z5cNhzShY4Vg0G2e7xdSlGf8TIVkT2lPqchmF0dYDM9XbBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Thông Báo</p>
            <h1>Thiết lập thông báo</h1>
            <p>Quản lý các loại thông báo bạn muốn nhận từ hệ thống.</p>
        </header>

        <div class="layout">
            <main class="content">
                <section class="panel">
                    <div class="panel-title">
                        <h2>Cài đặt thông báo</h2>
                        <p>Chọn nhận cập nhật đơn hàng, tin khuyến mãi và thông tin hệ thống.</p>
                    </div>
                    <div class="profile-summary">
                        <div class="field-group">
                            <div class="field">
                                <label>
                                    <input type="checkbox" disabled>
                                    Thông báo đơn hàng
                                </label>
                            </div>
                            <div class="field">
                                <label>
                                    <input type="checkbox" disabled>
                                    Tin khuyến mãi
                                </label>
                            </div>
                            <div class="field">
                                <label>
                                    <input type="checkbox" disabled>
                                    Cập nhật bảo mật
                                </label>
                            </div>
                        </div>
                        <p style="color: var(--text-secondary); margin-top: 1rem;">Tính năng cấu hình thông báo sẽ được hoàn thiện khi hệ thống tương tác đầy đủ với tài khoản.</p>
                    </div>
                    <div class="profile-actions">
                        <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Về trang chính</a>
                        <a href="profile.html" class="btn btn-primary"><i class="fas fa-user"></i> Quay lại Hồ Sơ</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>

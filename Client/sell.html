<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bán hàng | Giga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Giga</div>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="order.html">Đơn hàng</a></li>
            </ul>
        </nav>
    </header>
    <main class="page-content">
        <section class="page-panel">
            <h2>Quản lý sản phẩm bán</h2>
            <form id="sell-form" class="checkout-form">
                <div class="form-group">
                    <label for="product-name">Tên sản phẩm</label>
                    <input id="product-name" type="text" required>
                </div>
                <div class="form-group">
                    <label for="product-price">Giá</label>
                    <input id="product-price" type="number" min="0" required>
                </div>
                <div class="form-group">
                    <label for="product-image">URL hình ảnh</label>
                    <input id="product-image" type="text" required>
                </div>
                <button class="submit-btn" type="submit">Đăng sản phẩm</button>
            </form>
            <div class="product-list" id="seller-products"></div>
        </section>
    </main>
    <footer>
        <p>&copy; Giga</p>
    </footer>
</body>
</html>
